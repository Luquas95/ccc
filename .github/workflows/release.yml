# A tag X.Y.Z (no "v") makes the release and attaches both artifacts to it — the app
# and ccc itself look there for new versions (the same rules: src/ccc/releases.py):
#   ccc.apk     the Android app, signed with the release key (secrets
#               ANDROID_KEYSTORE_B64 / _PASSWORD / ANDROID_KEY_ALIAS);
#   ccc.tar.gz  ccc (the TUI, daemon and API) as a Python sdist, its version stamped
#               from the tag.
# A release made by hand with the tag is kept; an artifact already published is never replaced.
name: Release

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "ccc $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  tui:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install -e ".[dev]"
          python -m pytest -q
      - name: Build
        run: |
          sed -i "s/^__version__ = .*/__version__ = \"${GITHUB_REF_NAME}\"/" src/ccc/__init__.py
          pip install build
          python -m build --sdist
          cp dist/ccc-*.tar.gz ccc.tar.gz
      - name: Publish
        run: |
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx ccc.tar.gz; then
            echo "Release $GITHUB_REF_NAME already has ccc.tar.gz; not replacing it." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" ccc.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number counts commits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # No third-party action here: this job holds the signing key. The runner image
      # has the Android SDK; only its licences need accepting.
      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Release key
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ccc-release.jks"
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -Pccc.version="${GITHUB_REF_NAME}"
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/ccc-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Publish
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ccc.apk
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx ccc.apk; then
            echo "Release $GITHUB_REF_NAME already has ccc.apk; not replacing it." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" ccc.apk
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
