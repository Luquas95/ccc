# Tests of ccc (the TUI, daemon, API) and a build of the .deb tree on every pull request that
# touches them. Not a required check (protect-main has none), so a filtered-out run never blocks.
name: CI (ccc)

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "bin/**"
      - "packaging/**"
      - ".github/workflows/ci-python.yml"

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install -e ".[dev]"
          python -m pytest -q
      - name: The package tree builds
        run: packaging/build.sh 0.0.1
