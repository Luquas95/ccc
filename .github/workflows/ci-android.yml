# Unit tests of the Android app on every pull request that touches it (the release runs them
# too, but only when it is already too late). Not a required check.
name: CI (Android)

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/ci-android.yml"

permissions:
  contents: read

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number counts commits
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"  # Robolectric's Android 36 needs it
      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Test
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest
