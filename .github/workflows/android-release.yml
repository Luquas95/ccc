# A tag X.Y.Z (no "v") builds the Android app, signed with the release key (secrets
# ANDROID_KEYSTORE_B64 / _PASSWORD / ANDROID_KEY_ALIAS), and attaches it to the
# GitHub release as ccc.apk — the app looks there for new versions.
name: Android release

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number counts commits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # No third-party action here: this job holds the signing key. The runner image
      # has the Android SDK; only its licences need accepting.
      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Release key
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ccc-release.jks"
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -Pccc.version="${GITHUB_REF_NAME}"
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/ccc-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Publish
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ccc.apk
          # The release may already exist (made by hand with the tag): then only attach the
          # app — never replace one that is already published.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx ccc.apk; then
              echo "Release $GITHUB_REF_NAME already has ccc.apk; not replacing it." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" ccc.apk
          else
            gh release create "$GITHUB_REF_NAME" ccc.apk --title "ccc $GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
